[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "priora"
version = "0.1.0"
description = "Integrating Learned Action Priors into Generalist Robot Agents"
readme = "README.md"
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md", "priora/robodojo/justrua_sensors/LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "Pillow", "imageio", "imageio-ffmpeg", "msgpack", "PyYAML", "requests", "beautifulsoup4"]
[project.optional-dependencies]
test = ["pytest", "fonttools", "matplotlib"]
[project.scripts]
priora = "priora.cli:main"
priora-wall = "priora.robodojo.wall_oss.policy_server:main"
[tool.setuptools.packages.find]
include = ["priora*"]
[tool.setuptools.package-data]
priora = ["benchmarks/*.json", "benchmarks/*.patch", "robodojo/skill/*.md", "robodojo/skill/context/*", "robodojo/wall_oss/*.json", "robodojo/wall_oss/*.md", "robodojo/justrua_sensors/LICENSE", "robodojo/justrua_sensors/PROVENANCE.md"]
